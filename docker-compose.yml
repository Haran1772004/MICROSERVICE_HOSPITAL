services:
  auth-db:
    image: postgres:16
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  hospital-db:
    image: postgres:16
    container_name: hospital-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
      POSTGRES_DB: hospital_db
    ports:
      - "5433:5432"
    volumes:
      - hospital-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  appointment-db:
    image: postgres:16
    container_name: appointment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
      POSTGRES_DB: appointment_db
    ports:
      - "5434:5432"
    volumes:
      - appointment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointment_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NEW: Kafka (containers use kafka:19092, your IDE uses localhost:9092)
  kafka:
    image: apache/kafka:3.8.0
    container_name: hospital-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: auth-service
    image: hospital/auth-service:local
    restart: unless-stopped
    mem_limit: 400m
    cpus: 0.75
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in the .env file}
      HOSPITAL_SERVICE_URL: http://hospital-service:8082
    depends_on:
      auth-db:
        condition: service_healthy

  hospital-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: hospital-service
    image: hospital/hospital-service:local
    restart: unless-stopped
    mem_limit: 400m
    cpus: 0.75
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://hospital-db:5432/hospital_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in the .env file}
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      hospital-db:
        condition: service_healthy

  appointment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: appointment-service
    image: hospital/appointment-service:local
    restart: unless-stopped
    mem_limit: 400m
    cpus: 0.75
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
      SERVER_PORT: "8083"
      DB_URL: jdbc:postgresql://appointment-db:5432/appointment_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in the .env file}
      HOSPITAL_SERVICE_URL: http://hospital-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092            # NEW
    depends_on:
      appointment-db:
        condition: service_healthy
      kafka:                                          # NEW
        condition: service_healthy

  # NEW: notification service (H2 file database, no extra DB container)
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: notification-service
    image: hospital/notification-service:local
    restart: unless-stopped
    mem_limit: 400m
    cpus: 0.75
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
      SERVER_PORT: "8084"
      DB_URL: jdbc:h2:file:/data/notification_db
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in the .env file}
      HOSPITAL_SERVICE_URL: http://hospital-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REMINDER_MINUTES_BEFORE: ${REMINDER_MINUTES_BEFORE:-60}
    volumes:
      - notification-data:/data
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  auth-data:
  hospital-data:
  appointment-data:
  notification-data:   # NEW