server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service
  datasource:
    # H2 file database: data stays after restart (saved in ./data folder)
    url: ${DB_URL:jdbc:h2:file:./data/notification_db}
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

internal:
  api-secret: ${INTERNAL_API_SECRET}

services:
  hospital-url: ${HOSPITAL_SERVICE_URL:http://localhost:8082}
  timeout-ms: ${SERVICE_TIMEOUT_MS:3000}

reminder:
  # send the reminder this many minutes before the appointment
  minutes-before: ${REMINDER_MINUTES_BEFORE:60}
  # how often the timer checks for due reminders
  check-interval-ms: ${REMINDER_CHECK_INTERVAL_MS:30000}

app:
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
