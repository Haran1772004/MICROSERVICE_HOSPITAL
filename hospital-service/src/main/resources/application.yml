server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: hospital-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hospital_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  sql:
    init:
      # schema.sql only uses CREATE TABLE IF NOT EXISTS, so it is safe to run on every start.
      mode: always
  cache:
    type: ${CACHE_TYPE:caffeine}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

internal:
  api-secret: ${INTERNAL_API_SECRET}

services:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  timeout-ms: ${SERVICE_TIMEOUT_MS:3000}

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
